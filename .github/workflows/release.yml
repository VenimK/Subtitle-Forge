name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.6.5)

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            output_name: subtitle-forge-mac
            artifact_name: Subtitle-Forge-macOS
            package_cmd: fyne package -os darwin -icon assets/icon.png --app-id com.gmm.subtitleforge --app-version 1.6.9 -name "Subtitle Forge" -exe build/subtitle-forge-mac
          - os: ubuntu-latest
            output_name: subtitle-forge-linux
            artifact_name: subtitle-forge-linux
            package_cmd: fyne package -os linux -icon assets/icon.png --app-id com.gmm.subtitleforge --app-version 1.6.9 -name "Subtitle Forge" -exe build/subtitle-forge-linux
          - os: windows-latest
            output_name: subtitle-forge-windows.exe
            artifact_name: Subtitle-Forge-Windows
            package_cmd: fyne package -os windows -icon assets/icon.png --app-id com.gmm.subtitleforge --app-version 1.6.9 -name "Subtitle Forge" -exe build/subtitle-forge-windows.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Install Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      # Install Fyne CLI (works on all platforms)
      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      # Create build directory (platform-specific commands)
      - name: Create build directory (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: ./fyne-gui
        run: mkdir -p build

      - name: Create build directory (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build

      # Build application
      - name: Build application
        working-directory: ./fyne-gui
        run: go build -o build/${{ matrix.output_name }}

      # Package application
      - name: Package application
        working-directory: ./fyne-gui
        run: ${{ matrix.package_cmd }}

      # Create archive for macOS
      - name: Create macOS archive
        if: matrix.os == 'macos-latest'
        working-directory: ./fyne-gui
        run: zip -r ${{ matrix.artifact_name }}.zip "Subtitle Forge.app"

      # Create archive for Linux
      - name: Create Linux archive
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./fyne-gui
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz build/${{ matrix.output_name }}

      # Create archive for Windows
      - name: Create Windows archive
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: Compress-Archive -Path "Subtitle Forge.exe" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      # Upload artifacts
      - name: Upload ZIP artifacts
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.zip
          retention-days: 1

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Subtitle-Forge-macOS/Subtitle-Forge-macOS.zip
            subtitle-forge-linux/subtitle-forge-linux.tar.gz
            Subtitle-Forge-Windows/Subtitle-Forge-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
