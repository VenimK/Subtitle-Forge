name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.6.5)

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            output_name: subtitle-forge-mac
            artifact_name: Subtitle-Forge-macOS
            package_cmd: fyne package -os darwin -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/subtitle-forge-mac
          - os: ubuntu-latest
            output_name: subtitle-forge-linux
            artifact_name: subtitle-forge-linux
            package_cmd: fyne package -os linux -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/subtitle-forge-linux
          - os: windows-latest
            output_name: subtitle-forge-windows.exe
            artifact_name: Subtitle-Forge-Windows
            package_cmd: fyne package -os windows -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/subtitle-forge-windows.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'


      # Install Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      # Install Fyne CLI (works on all platforms)
      - name: Install Fyne CLI
        run: |
          # Install both versions to ensure compatibility
          go install fyne.io/fyne/v2/cmd/fyne@latest
          go install fyne.io/tools/cmd/fyne@latest
          # Add Go bin to PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Create build directory (platform-specific commands)
      - name: Create build directory (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: ./fyne-gui
        run: mkdir -p build

      - name: Create build directory (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build

      # Build application
      - name: Build application
        working-directory: ./fyne-gui
        run: go build -ldflags="-X 'main.AppVersion=${{ github.ref_name }}'" -o build/${{ matrix.output_name }}

      # Package application
      - name: Extract version without v prefix
        id: version
        shell: bash
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT

      # Package application (macOS and Linux)
      - name: Package application (macOS and Linux)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        working-directory: ./fyne-gui
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Try different parameter formats
          fyne package -os ${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }} -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }} --app-version "$VERSION" || \
          fyne package -os ${{ matrix.os == 'macos-latest' && 'darwin' || 'linux' }} -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }} --appVersion "$VERSION"

      # Package application (Windows)
      - name: Package application (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # Try different parameter formats
          try {
            fyne package -os windows -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }} --app-version $version
          } catch {
            fyne package -os windows -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }} --appVersion $version
          }

      # Create archive for macOS
      - name: Create macOS archive
        if: matrix.os == 'macos-latest'
        working-directory: ./fyne-gui
        run: zip -r ${{ matrix.artifact_name }}.zip "Subtitle Forge.app"

      # Create archive for Linux
      - name: Create Linux archive
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./fyne-gui
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz build/${{ matrix.output_name }}

      # Create archive for Windows
      - name: Create Windows archive
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: |
          # List files to debug
          Write-Host "Listing files in current directory:"
          Get-ChildItem
          
          Write-Host "Listing files in build directory:"
          Get-ChildItem -Path build -ErrorAction SilentlyContinue
          
          # Try to find the executable and create archive
          if (Test-Path "Subtitle Forge.exe") {
            Write-Host "Found Subtitle Forge.exe in current directory"
            Compress-Archive -Path "Subtitle Forge.exe" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          } elseif (Test-Path "build\subtitle-forge-windows.exe") {
            Write-Host "Found subtitle-forge-windows.exe in build directory"
            Compress-Archive -Path "build\subtitle-forge-windows.exe" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          } else {
            # Find any exe files
            Write-Host "Searching for any .exe files..."
            $exeFiles = Get-ChildItem -Recurse -Filter "*.exe"
            if ($exeFiles.Count -gt 0) {
              Write-Host "Found executable files:"
              foreach ($file in $exeFiles) {
                Write-Host $file.FullName
              }
              # Use the first exe file found
              Write-Host "Using $($exeFiles[0].FullName) for archive"
              Compress-Archive -Path $exeFiles[0].FullName -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
            } else {
              Write-Error "No executable files found!"
              exit 1
            }
          }

      # Upload artifacts
      - name: Upload ZIP artifacts
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.zip
          retention-days: 1

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Subtitle-Forge-macOS/Subtitle-Forge-macOS.zip
            subtitle-forge-linux/subtitle-forge-linux.tar.gz
            Subtitle-Forge-Windows/Subtitle-Forge-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
