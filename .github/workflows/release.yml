name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.6.5)

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            output_name: subtitle-forge-mac-arm64
            artifact_name: Subtitle-Forge-macOS-ARM64
            arch: arm64
          - os: macos-13
            output_name: subtitle-forge-mac-x86_64
            artifact_name: Subtitle-Forge-macOS-Intel
            arch: x86_64
          - os: ubuntu-latest
            output_name: subtitle-forge-linux
            artifact_name: subtitle-forge-linux
            package_cmd: fyne package -os linux -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/subtitle-forge-linux
          - os: windows-latest
            output_name: subtitle-forge-windows.exe
            artifact_name: Subtitle-Forge-Windows
            package_cmd: fyne package -os windows -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/subtitle-forge-windows.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'


      # Install Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      # Install Fyne CLI (works on all platforms)
      - name: Install Fyne CLI
        run: |
          # Install both versions to ensure compatibility
          go install fyne.io/fyne/v2/cmd/fyne@latest
          go install fyne.io/tools/cmd/fyne@latest
          # Add Go bin to PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Create build directory (platform-specific commands)
      - name: Create build directory (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: ./fyne-gui
        run: mkdir -p build

      - name: Create build directory (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build

      # Build macOS binaries (native for each architecture)
      - name: Build macOS binary (${{ matrix.arch }})
        if: startsWith(matrix.os, 'macos')
        working-directory: ./fyne-gui
        run: |
          echo "Building macOS binary natively for ${{ matrix.arch }}..."
          go build -ldflags="-X 'main.AppVersion=${{ github.ref_name }}'" -o build/${{ matrix.output_name }}
          
          # Verify the binary
          file build/${{ matrix.output_name }}
          echo "✅ macOS ${{ matrix.arch }} binary created successfully"
          
          # Create the .app bundle using fyne package
          echo "Creating macOS app bundle for ${{ matrix.arch }}..."
          fyne package -os darwin -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }}
          
          # Verify the app bundle was created
          if [ -d "Subtitle Forge.app" ]; then
            echo "✅ macOS ${{ matrix.arch }} app bundle created successfully"
            file "Subtitle Forge.app/Contents/MacOS/${{ matrix.output_name }}"
            
            # Copy installation scripts into the app bundle
            echo "Copying installation scripts into app bundle..."
            cp install_vobsub2srt.sh "Subtitle Forge.app/Contents/MacOS/" 2>/dev/null || echo "⚠️  install_vobsub2srt.sh not found"
            cp install_pgsrip.sh "Subtitle Forge.app/Contents/MacOS/" 2>/dev/null || echo "⚠️  install_pgsrip.sh not found"
            cp install_tessdata.sh "Subtitle Forge.app/Contents/MacOS/" 2>/dev/null || echo "⚠️  install_tessdata.sh not found"
            chmod +x "Subtitle Forge.app/Contents/MacOS/"*.sh 2>/dev/null || true
            echo "✅ Installation scripts copied"
            
            # Create zip archive
            zip -r ${{ matrix.artifact_name }}.zip "Subtitle Forge.app"
            echo "✅ macOS ${{ matrix.arch }} archive created"
            ls -la ${{ matrix.artifact_name }}.zip
          else
            echo "❌ Failed to create macOS app bundle"
            exit 1
          fi

      # Build and package application (Linux) 
      - name: Build and package application (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./fyne-gui
        run: |
          chmod +x build.sh bundle_linux_deps.sh
          
          # Ensure build directory exists
          mkdir -p build
          
          # Build Linux binary directly (no cross-compilation needed on Linux)
          echo "Building Linux binary..."
          go build -ldflags="-X 'main.AppVersion=${{ github.ref_name }}'" -o build/subtitle-forge-linux
          
          # Verify binary was created and is executable
          if [ ! -f "build/subtitle-forge-linux" ]; then
            echo "Error: Failed to create Linux binary"
            echo "Checking go build output..."
            go build -v -ldflags="-X 'main.AppVersion=${{ github.ref_name }}'" -o build/subtitle-forge-linux
            exit 1
          fi
          
          echo "Linux binary created successfully"
          ls -la build/subtitle-forge-linux
          file build/subtitle-forge-linux
          
          # Don't run build.sh as it might remove our binary, create packages manually
          echo "Creating Linux package with installation scripts..."
          mkdir -p build/linux
          cp build/subtitle-forge-linux build/linux/
          
          # Copy installation scripts
          cp LinuxHeadless.sh build/linux/install_dependencies.sh
          cp install_vobsub2srt.sh build/linux/ 2>/dev/null || echo "install_vobsub2srt.sh not found"
          cp install_pgsrip.sh build/linux/ 2>/dev/null || echo "install_pgsrip.sh not found"
          cp install_tessdata.sh build/linux/ 2>/dev/null || echo "install_tessdata.sh not found"
          
          # Copy documentation
          cp ../README.md build/linux/ 2>/dev/null || echo "README.md not found"
          cp ../LICENSE.md build/linux/ 2>/dev/null || echo "LICENSE.md not found"
          
          # Create INSTALL.md
          echo "# Subtitle Forge Linux Installation v2.0.6" > build/linux/INSTALL.md
          echo "" >> build/linux/INSTALL.md
          echo "## Quick Start" >> build/linux/INSTALL.md
          echo "1. Extract this archive to your desired location" >> build/linux/INSTALL.md
          echo "2. Make the binary executable: chmod +x subtitle-forge-linux" >> build/linux/INSTALL.md
          echo "3. Install dependencies: sudo ./install_dependencies.sh" >> build/linux/INSTALL.md
          echo "4. Run the application: ./subtitle-forge-linux" >> build/linux/INSTALL.md
          echo "" >> build/linux/INSTALL.md
          echo "## Installation Scripts Included" >> build/linux/INSTALL.md
          echo "- install_dependencies.sh - Main dependency installer" >> build/linux/INSTALL.md
          echo "- install_vobsub2srt.sh - VobSub2SRT installation script" >> build/linux/INSTALL.md
          echo "- install_pgsrip.sh - PGSRip installation script" >> build/linux/INSTALL.md
          echo "- install_tessdata.sh - Tesseract language data installer" >> build/linux/INSTALL.md
          echo "" >> build/linux/INSTALL.md
          echo "## What's New in v2.0.6" >> build/linux/INSTALL.md
          echo "- Fixed GST path persistence - custom paths are now saved" >> build/linux/INSTALL.md
          echo "- All installation scripts included" >> build/linux/INSTALL.md
          echo "- Proper dependency installation workflow" >> build/linux/INSTALL.md
          
          # Create the package
          tar -czf build/subtitle-forge-linux.tar.gz -C build linux
          echo "✅ Linux package created"
          
          # List final build contents
          echo "Final build directory contents:"
          ls -la build/

      # Build application (Windows)
      - name: Build application (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: |
          go build -ldflags="-X 'main.AppVersion=${{ github.ref_name }}'" -o build/${{ matrix.output_name }}
          # Use fyne package for Windows
          fyne package -os windows -icon assets/icon.png --id com.gmm.subtitleforge -name "Subtitle Forge" -exe build/${{ matrix.output_name }}

      # Create archive for Linux (use packages from build.sh)
      - name: Create Linux archive
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./fyne-gui
        run: |
          echo "Looking for Linux packages..."
          ls -la build/ || echo "Build directory not found"
          
          # Use the packages created by build.sh
          if [ -f "build/subtitle-forge-linux.tar.gz" ]; then
            echo "Using build.sh created package"
            cp build/subtitle-forge-linux.tar.gz ${{ matrix.artifact_name }}.tar.gz
          elif [ -f "build/subtitle-forge-linux" ]; then
            echo "Creating basic package from binary"
            tar -czf ${{ matrix.artifact_name }}.tar.gz build/subtitle-forge-linux
          else
            echo "Error: No Linux binary or package found"
            exit 1
          fi
          
          echo "Final package created:"
          ls -la ${{ matrix.artifact_name }}.tar.gz

      # Create archive for Windows
      - name: Create Windows archive
        if: matrix.os == 'windows-latest'
        working-directory: ./fyne-gui
        shell: pwsh
        run: |
          # List files to debug
          Write-Host "Listing files in current directory:"
          Get-ChildItem
          
          Write-Host "Listing files in build directory:"
          Get-ChildItem -Path build -ErrorAction SilentlyContinue
          
          # Try to find the executable and create archive
          if (Test-Path "Subtitle Forge.exe") {
            Write-Host "Found Subtitle Forge.exe in current directory"
            Compress-Archive -Path "Subtitle Forge.exe" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          } elseif (Test-Path "build\subtitle-forge-windows.exe") {
            Write-Host "Found subtitle-forge-windows.exe in build directory"
            Compress-Archive -Path "build\subtitle-forge-windows.exe" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          } else {
            # Find any exe files
            Write-Host "Searching for any .exe files..."
            $exeFiles = Get-ChildItem -Recurse -Filter "*.exe"
            if ($exeFiles.Count -gt 0) {
              Write-Host "Found executable files:"
              foreach ($file in $exeFiles) {
                Write-Host $file.FullName
              }
              # Use the first exe file found
              Write-Host "Using $($exeFiles[0].FullName) for archive"
              Compress-Archive -Path $exeFiles[0].FullName -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
            } else {
              Write-Error "No executable files found!"
              exit 1
            }
          }

      # Upload artifacts
      - name: Upload macOS app
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.zip
          retention-days: 1

      - name: Upload Windows ZIP artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.zip
          retention-days: 1

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./fyne-gui/${{ matrix.artifact_name }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Subtitle-Forge-macOS-ARM64/Subtitle-Forge-macOS-ARM64.zip
            Subtitle-Forge-macOS-Intel/Subtitle-Forge-macOS-Intel.zip
            subtitle-forge-linux/subtitle-forge-linux.tar.gz
            Subtitle-Forge-Windows/Subtitle-Forge-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
